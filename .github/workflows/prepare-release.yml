name: Prepare release

run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new package version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open reviewed release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_WORKFLOWS: ci.yml
    steps:
      - name: Check out protected main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate source and prepare package versions
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/prepare-release.yml@refs/heads/main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node scripts/prepare-release.mjs --version "$RELEASE_VERSION"
          changed_paths="$(git diff --name-only | sort)"
          expected_paths="$(printf '%s\n' package-lock.json package.json)"
          test "$changed_paths" = "$expected_paths"

      - name: Refuse existing tag or unowned candidate branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          branch="automation/release-$tag"
          set +e
          git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null
          tag_status=$?
          set -e
          case "$tag_status" in
            0) echo "Release tag $tag already exists" >&2; exit 1 ;;
            2) ;;
            *) echo "Could not establish whether release tag $tag exists" >&2; exit 1 ;;
          esac
          set +e
          git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null
          branch_status=$?
          set -e
          if [ "$branch_status" -eq 0 ]; then
            pr_url="$(gh pr list --state open --base main --head "$branch" --json url --jq '.[0].url // empty')"
            test -n "$pr_url"
            pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
            printf 'pr_url=%s\npr_number=%s\nexisting=true\n' "$pr_url" "$pr_number" >> "$GITHUB_OUTPUT"
          elif [ "$branch_status" -eq 2 ]; then
            printf 'branch=%s\nexisting=false\n' "$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Could not establish whether release branch $branch exists" >&2
            exit 1
          fi

      - name: Create version-only release commit
        if: steps.candidate.outputs.existing == 'false'
        env:
          RELEASE_BRANCH: ${{ steps.candidate.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(release): prepare v$RELEASE_VERSION" -- package.json package-lock.json
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Open release pull request
        if: steps.candidate.outputs.existing == 'false'
        id: pull-request
        env:
          RELEASE_BRANCH: ${{ steps.candidate.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          body_file="$RUNNER_TEMP/release-pr.md"
          cat > "$body_file" <<EOF
          Prepare Cloudflare Fleet v$RELEASE_VERSION. This pull request changes only the package version metadata.

          Merging after required checks pass authorizes the exact successful protected-main artifact to receive the annotated tag and GitHub Release. Production and documentation deployment remain separate main-workflow operations.
          EOF
          pr_url="$(gh pr create --base main --head "$RELEASE_BRANCH" --title "chore(release): prepare v$RELEASE_VERSION" --body-file "$body_file")"
          pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          printf 'pr_url=%s\npr_number=%s\n' "$pr_url" "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Start required release PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.existing == 'true' && steps.candidate.outputs.pr_number || steps.pull-request.outputs.pr_number }}
        run: node scripts/start-release-checks.mjs "$PR_NUMBER"

      - name: Summarize release candidate
        env:
          PR_URL: ${{ steps.candidate.outputs.existing == 'true' && steps.candidate.outputs.pr_url || steps.pull-request.outputs.pr_url }}
        run: |
          printf "Release candidate: [%s](%s)\n\nMerge it after required checks pass to publish v%s.\n" "$PR_URL" "$PR_URL" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
