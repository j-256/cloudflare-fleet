name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Verification only, or an exact documentation or production redeployment from main
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy-documentation
          - deploy-production

permissions:
  contents: read

jobs:
  verify:
    name: Verify public source and product
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      hosting_sha256: ${{ steps.hosting-digest.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit application and deployment dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run ergonomics checks
        run: npm run test:e2e:ergonomics

      - name: Validate shell launcher
        run: shellcheck launch.sh

      - name: Build hosted assets
        run: npm run build:hosted

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.example.jsonc

      - name: Generate synthetic product screenshots
        run: npm run screenshots:ci

      - name: Build locked self-hosting release
        run: npm run build:self-hosted -- --output self-hosted-dist --require-clean

      - name: Verify exact self-hosting installation and upgrade
        run: npm run check:self-hosted -- --directory self-hosted-dist

      - name: Pack and verify exact CLI artifact
        run: |
          artifact_name="$(npm pack --ignore-scripts --pack-destination self-hosted-dist)"
          npm run check:install -- --artifact "self-hosted-dist/$artifact_name"

      - name: Check publication safety
        run: npm run check:publication

      - name: Build documentation artifact
        run: npm run build:docs

      - name: Validate documentation Worker
        run: npm run deploy:docs:dry-run

      - name: Record verified hosting archive digest
        id: hosting-digest
        run: printf 'sha256=%s\n' "$(sha256sum self-hosted-dist/*-self-hosted.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: self-hosted-release
          path: self-hosted-dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: documentation-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Retain generated project cover
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: test-results/publication-screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Publish documentation
    if: ${{ vars.CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-documentation')) && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    needs: verify
    environment:
      name: documentation
      url: ${{ vars.CLOUDFLARE_FLEET_DOCUMENTATION_URL }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: documentation-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download exact verified documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: documentation-dist

      - name: Deploy exact verified documentation artifact
        run: npm run deploy:docs -- --message "GitHub Actions ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION: ${{ vars.CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION }}

      - name: Verify exact public documentation
        run: npm run check:docs:public -- --manifest documentation-dist/publication-manifest.json --attempts 6 --delay-ms 10000
        env:
          CLOUDFLARE_FLEET_DOCUMENTATION_URL: ${{ vars.CLOUDFLARE_FLEET_DOCUMENTATION_URL }}

  production:
    name: Deploy verified production release
    if: ${{ vars.CLOUDFLARE_FLEET_DEPLOY_PRODUCTION == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-production')) && github.ref == 'refs/heads/main' && github.ref_protected && needs.verify.result == 'success' }}
    needs: verify
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_FLEET_PRODUCTION_URL }}
    concurrency:
      group: fleet-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_FLEET_DEPLOY_PRODUCTION: ${{ vars.CLOUDFLARE_FLEET_DEPLOY_PRODUCTION }}
      CLOUDFLARE_FLEET_VERIFICATION_RESULT: ${{ needs.verify.result }}
      CLOUDFLARE_FLEET_CI_OPERATION: ${{ inputs.operation }}
      CLOUDFLARE_FLEET_ARTIFACT_SHA256: ${{ needs.verify.outputs.hosting_sha256 }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install verification helper dependencies
        run: npm ci

      - name: Download same-run verified hosting archive
        uses: actions/download-artifact@v8
        with:
          name: self-hosted-release
          path: self-hosted-dist

      - name: Validate digest and extract exact verified source
        id: prepare
        run: node scripts/deploy-production.mjs --prepare --directory self-hosted-dist

      - name: Install and build locked release without production credentials
        working-directory: ${{ steps.prepare.outputs.release_dir }}
        run: npm ci --include=dev && npm run build:hosted

      - name: Preflight, deploy once, and verify protected production
        run: node scripts/deploy-production.mjs --release-dir "$RELEASE_DIR"
        env:
          RELEASE_DIR: ${{ steps.prepare.outputs.release_dir }}
          CLOUDFLARE_FLEET_RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FLEET_URL: ${{ vars.CLOUDFLARE_FLEET_PRODUCTION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_FLEET_DEPLOYMENT_CONFIG: ${{ secrets.CLOUDFLARE_FLEET_DEPLOYMENT_CONFIG }}
          CLOUDFLARE_FLEET_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_FLEET_ACCESS_CLIENT_ID }}
          CLOUDFLARE_FLEET_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_FLEET_ACCESS_CLIENT_SECRET }}

  publish-cover:
    name: Publish project cover
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.result == 'success' && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped') && (needs.production.result == 'success' || needs.production.result == 'skipped') }}
    needs: [verify, documentation, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: docs/screenshots
      - name: Open an automatically merged cover pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COVER_WORKFLOWS: ci.yml
        run: |
          set -eu
          gh auth setup-git --hostname github.com
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          branch="automation/project-cover-${GITHUB_SHA}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "$branch"
            changed_paths="$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD)"
            test "$changed_paths" = docs/screenshots/cover.png
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/screenshots/cover.png
            git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
            git push origin "HEAD:$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            body_file="$RUNNER_TEMP/cover-pr.md"
            cat > "$body_file" <<EOF
          Refresh the project cover from the verified source build. This pull request changes only the generated screenshot.

          Capture: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            pr_url="$(gh pr create --base main --head "$branch" --title 'docs: refresh generated project cover' --body-file "$body_file")"
          fi
          pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          node scripts/start-cover-checks.mjs "$pr_number"
          gh pr merge "$pr_url" --auto --squash
