name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Verification only, or an exact documentation redeployment from main
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy-documentation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public source and product
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run browser tests
        run: npm run test:e2e

      - name: Validate shell launcher
        run: shellcheck launch.sh

      - name: Build hosted assets
        run: npm run build:hosted

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.example.jsonc

      - name: Generate synthetic product screenshots
        run: npm run screenshots:ci

      - name: Verify packed installation
        run: npm run check:install

      - name: Check publication safety
        run: npm run check:publication

      - name: Build documentation artifact
        run: npm run build:docs

      - name: Validate documentation Worker
        run: npm run deploy:docs:dry-run

      - name: Upload verified documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: documentation-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Publish documentation
    if: ${{ vars.CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-documentation')) && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    needs: verify
    environment:
      name: documentation
      url: ${{ vars.CLOUDFLARE_FLEET_DOCUMENTATION_URL }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download exact verified documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: documentation-dist

      - name: Deploy exact verified documentation artifact
        run: npm run deploy:docs -- --message "GitHub Actions ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION: ${{ vars.CLOUDFLARE_FLEET_PUBLISH_DOCUMENTATION }}

      - name: Verify exact public documentation
        run: npm run check:docs:public -- --manifest documentation-dist/publication-manifest.json --attempts 6 --delay-ms 10000
        env:
          CLOUDFLARE_FLEET_DOCUMENTATION_URL: ${{ vars.CLOUDFLARE_FLEET_DOCUMENTATION_URL }}
