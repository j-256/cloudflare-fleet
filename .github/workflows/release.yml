name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish source artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag
        run: npm run check:release-tag -- "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run browser tests
        run: npm run test:e2e

      - name: Validate shell launcher
        run: shellcheck launch.sh

      - name: Build hosted assets
        run: npm run build:hosted

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.example.jsonc

      - name: Generate synthetic product screenshots
        run: npm run screenshots:ci

      - name: Verify packed installation
        run: npm run check:install

      - name: Check publication safety
        run: npm run check:publication

      - name: Build documentation artifact
        run: npm run build:docs

      - name: Validate documentation Worker
        run: npm run deploy:docs:dry-run

      - name: Pack source artifact
        id: artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/cloudflare-fleet-release
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          artifact_name="$(npm pack --pack-destination "$ARTIFACT_DIRECTORY")"
          echo "path=$ARTIFACT_DIRECTORY/$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.artifact.outputs.path }}" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
